{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Tech Components{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.0">
    </head>
    <body>
        <h2>{% block subtitle %}{% endblock %}</h2>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </body>
</html>
